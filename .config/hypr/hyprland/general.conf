# ================================ #
# Hyprland General Configuration
# ================================ #
source=~/.config/hypr/hyprland/var.conf
source=~/.config/hypr/scheme/current.conf

# -------------------------------- #
# Look and Feel Configuration
# -------------------------------- #
# Refer to https://wiki.hyprland.org/Configuring/Variables/
general {
    gaps_in = 5
    gaps_out = 20
    gaps_workspaces = 20
    border_size = 2
    col.active_border = rgba($primaryff) rgba($secondaryff) 45deg
    col.inactive_border = rgba($onPrimaryff)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba($onPrimaryaa)
    }


    # Window Opacities
    # active_opacity = 1
    # inactive_opacity = 1
    # fullscreen_opacity = 1
    
    # Shader
    # screen_shader = ~/.config/hypr/shaders/nothing.frag
    # screen_shader = ~/.config/hypr/shaders/vibrance.frag
    
    # Dim
    # dim_inactive = false
    # dim_strength = 0.1
    dim_special = 0.6

    blur {
        enabled = true
        xray = false
        special = false
        new_optimizations = true
        size = 12
        passes = 3
        noise = 0.05
        contrast = 1
        brightness = 0.6
        vibrancy = 0.0
        vibrancy_darkness = 0.0
        popups = false
        popups_ignorealpha = 0.6
        ignore_opacity = true
    }
}

