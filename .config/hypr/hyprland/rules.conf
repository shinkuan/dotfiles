# Layer Rules
# layerrule = blur, ^(rofi)$
# layerrule = ignorezero, ^(rofi)$

# Shell
# layerrule = noanim, caelestia-(launcher|osd|notifications|border-exclusion|area-p>
# layerrule = animation fade, caelestia-(drawers|background)
# layerrule = order 1, caelestia-border-exclusion
# layerrule = order 2, caelestia-bar
# layerrule = xray 1, caelestia-(border|launcher|bar|sidebar|navbar|mediadisplay|sc>
# layerrule = blur, caelestia-.*
# layerrule = blur, qs-.*
# layerrule = blurpopups, caelestia-.*
# layerrule = ignorealpha 0.2, caelestia-.*
layerrule {
  name = layerrule-1
  blur = on
  ignore_alpha = 0
  animation = fadeLayers
  match:namespace = quickshell:overview
}

layerrule {
  name = layerrule-waifuland
  animation = fadeLayers
  match:namespace = waifuland
}

layerrule {
  name = layerrule-quickvoice
  blur = on
  ignore_alpha = 0
  match:namespace = quickvoice
}

