# ================================ #
# Hyprland Rules Configuration
# ================================ #
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}


# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


# yad dialog
windowrule {
  name = windowrule-3
  float = on
  max_size = (monitor_w*0.5) (monitor_h*0.5)
  center = (1)
  match:class = ^(yad)$
}

windowrule {
  name = edge-fuck-you-1
  float = on
  no_anim = on
  no_focus = on
  border_size = 0
  no_shadow = on
  match:class = ^$
  match:title = ^$
}

# Dialog windows – float+center these windows.
windowrule {
  name = windowrule-4
  center = on
  float = on
  max_size = (monitor_w*0.6) (monitor_h*0.6)
  match:title = ^(?i)(Open File)(.*)$
}

windowrule {
  name = windowrule-5
  center = on
  float = on
  match:title = ^(?i)(All files)(.*)$
}

windowrule {
  name = windowrule-6
  center = on
  float = on
  max_size = (monitor_w*0.6) (monitor_h*0.6)
  match:title = ^(?i)(Select a File)(.*)$
}

windowrule {
  name = windowrule-7
  center = on
  float = on
  match:title = ^(?i)(Choose wallpaper)(.*)$
}

windowrule {
  name = windowrule-8
  center = on
  float = on
  max_size = (monitor_w*0.6) (monitor_h*0.6)
  match:title = ^(?i)(Open Folder)(.*)$
}

windowrule {
  name = windowrule-9
  center = on
  float = on
  max_size = (monitor_w*0.6) (monitor_h*0.6)
  match:title = ^(?i)(Save As)(.*)$
}

windowrule {
  name = windowrule-10
  center = on
  float = on
  match:title = ^(?i)(Library)(.*)$
}

windowrule {
  name = windowrule-11
  center = on
  float = on
  match:title = ^(?i)(File Upload)(.*)$
}

windowrule {
  name = windowrule-12
  float = on
  match:class = ^(org.pulseaudio.pavucontrol)$
}

windowrule {
  name = windowrule-LINE
  float = on
  center = on
  match:class = ^(msedge-_ophjlpahpchlmihnnnihgmmeilfjmjjc-Default)$
}



# Blur Rules
# windowrulev2 = opacity 1 1,class:^(foot)$
# windowrulev2 = opacity 0.1 0.1,class:^(rofi)$
# windowrulev2 = opacity 0.8 0.8,class:^(Microsoft-edge)$
# windowrulev2 = opacity 0.7 0.7,class:^(code)$
windowrule {
  name = windowrule-13
  no_blur = on
  match:class = ^()$
  match:title = ^()$
}

windowrule {
  name = windowrule-14
  no_blur = false
  match:class = ^(org.gnome.Nautilus)$
}


