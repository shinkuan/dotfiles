# Hypr-DarkWindow is managed by hyprpm. This script keeps the built plugin in
# sync with the running Hyprland: it auto-rebuilds on Hyprland updates (via a
# GUI sudo prompt) and disables the feature with a notification when the plugin
# can't build for the current Hyprland version yet.
#
# Loading + shader configuration happen on demand in hyprland/rpm.lua when the
# darkwindow shader is toggled on, so nothing is force-loaded at startup.
exec-once = ~/.config/hypr/custom_scripts/darkwindow_hyprpm_sync.sh
