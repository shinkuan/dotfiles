bind = Ctrl+Super, Space, exec, hyprkool switch-to-activity -n default
bind = Ctrl+Super, Z,     exec, hyprkool switch-to-activity -n Z
bind = Ctrl+Super, X,     exec, hyprkool switch-to-activity -n X
bind = Ctrl+Super, C,     exec, hyprkool switch-to-activity -n C
bind = Ctrl+Super, A,     exec, hyprkool switch-to-activity -n A
bind = Ctrl+Super, S,     exec, hyprkool switch-to-activity -n S
bind = Ctrl+Super, D,     exec, hyprkool switch-to-activity -n D
bind = Ctrl+Super, Q,     exec, hyprkool switch-to-activity -n Q
bind = Ctrl+Super, W,     exec, hyprkool switch-to-activity -n W
bind = Ctrl+Super, E,     exec, hyprkool switch-to-activity -n E

bind = Ctrl+Super SHIFT, Space, exec, hyprkool switch-to-activity -w -n default
bind = Ctrl+Super SHIFT, Z,     exec, hyprkool switch-to-activity -w -n Z
bind = Ctrl+Super SHIFT, X,     exec, hyprkool switch-to-activity -w -n X
bind = Ctrl+Super SHIFT, C,     exec, hyprkool switch-to-activity -w -n C
bind = Ctrl+Super SHIFT, A,     exec, hyprkool switch-to-activity -w -n A
bind = Ctrl+Super SHIFT, S,     exec, hyprkool switch-to-activity -w -n S
bind = Ctrl+Super SHIFT, D,     exec, hyprkool switch-to-activity -w -n D
bind = Ctrl+Super SHIFT, Q,     exec, hyprkool switch-to-activity -w -n Q
bind = Ctrl+Super SHIFT, W,     exec, hyprkool switch-to-activity -w -n W
bind = Ctrl+Super SHIFT, E,     exec, hyprkool switch-to-activity -w -n E

bind = Super, TAB, exec, qs ipc -c overview call overview toggle
bind = Super, S, exec, qs ipc -c quickvoice call quickvoice start

bind = Ctrl+Super, left, exec, hyprkool move-left
bind = Ctrl+Super, right, exec, hyprkool move-right
bind = Ctrl+Super, up, exec, hyprkool move-up
bind = Ctrl+Super, down, exec, hyprkool move-down

bind = Ctrl+Super SHIFT, left, exec, hyprkool move-left -w
bind = Ctrl+Super SHIFT, right, exec, hyprkool move-right -w
bind = Ctrl+Super SHIFT, up, exec, hyprkool move-up -w
bind = Ctrl+Super SHIFT, down, exec, hyprkool move-down -w

bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = Shift+ALT, Tab, cyclenext, prev
bind = Shift+ALT, Tab, bringactivetotop,

bind = Ctrl+Super+Alt, left, exec, hyprkool next-monitor -c -w
bind = Ctrl+Super+Alt, right, exec, hyprkool prev-monitor -c -w


