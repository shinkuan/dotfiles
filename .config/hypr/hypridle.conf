# Idle management (hypridle).
#
# Detection lives here, OUT of the desktop shell on purpose: if the shell
# crashes, auto-lock must keep working. The shell only contributes idle
# *inhibition* (Keep-awake toggle / audio playback) via the Wayland idle
# inhibit protocol, which hypridle respects by default.
#
# NOT started by the current session yet — enabling it while the caelestia
# shell's own idle handling is alive would double-fire lock/DPMS. Autostart
# switches over in Phase 5; nested test sessions may start it freely (it
# binds to its own WAYLAND_DISPLAY).
#
# Note: Hyprland 0.56 `hyprctl dispatch` evaluates a Lua expression, hence
# the hl.dsp.* forms below.

general {
    lock_cmd = pidof hyprlock || hyprlock    # never start a second instance
    before_sleep_cmd = loginctl lock-session # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 15 min -> lock (same timeout the previous setup used)
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# 30 min -> screens off, back on with activity (same as previous setup)
listener {
    timeout = 1800
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
