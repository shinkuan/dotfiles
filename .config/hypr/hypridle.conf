# Idle detection lives outside the shell so auto-lock survives shell crashes;
# the shell only contributes inhibition via the Wayland idle-inhibit protocol.
# Do not run alongside another idle manager (double-fires lock/DPMS).
# Hyprland 0.56 `hyprctl dispatch` takes a Lua expression, hence hl.dsp.*.

general {
    lock_cmd = pidof hyprlock || hyprlock    # never start a second instance
    before_sleep_cmd = loginctl lock-session # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 15 min -> lock (same timeout the previous setup used)
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# 30 min -> screens off, back on with activity (same as previous setup)
listener {
    timeout = 1800
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
