# shell=fish
shell=fish
term=xterm-256color

title=foot

font=NotoSansMNerdFontMono-ExtraCondensedRegular:size=15 
letter-spacing=0
dpi-aware=no

pad=25x25

bold-text-in-bright=no

[main]
# include=~/.config/foot/themes/noctalia
# Generated terminal palette (hellwal or M3 term0-15 — the scheme tool's
# config decides which). foot cannot expand env vars in include=, so this is
# the literal XDG default path; the generator writes to
# $XDG_CACHE_HOME/scheme/foot.ini, which is this same file unless
# XDG_CACHE_HOME is customised. If the file is missing foot logs an error
# and starts with default colours (verified, not fatal).
include=~/.cache/scheme/foot.ini

[scrollback]
lines=10000

[cursor]
style=beam
blink=no
beam-thickness=1.5
# underline-thickness=<font underline thickness>

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
clipboard-copy=Control+c
clipboard-paste=Control+v
# primary-paste=Shift+Insert
search-start=Control+f
# font-increase=Control+plus Control+equal Control+KP_Add
# font-decrease=Control+minus Control+KP_Subtract
# font-reset=Control+0 Control+KP_0

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
delete-prev-word=Control+BackSpace

[text-bindings]
\x03=Control+Shift+c

[colors-dark]
alpha=0.5
blur=yes